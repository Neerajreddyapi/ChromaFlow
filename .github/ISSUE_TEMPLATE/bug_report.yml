name: Bug report
description: Something in Chroma Flow isn't working right
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please fill in as much as you can. Screenshots or a short screen recording help a lot.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect to see?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Pick the Lava style
        2. Set Quality to Ultra
        3. Tap Play and draw
        4. ...
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone model
      placeholder: e.g. Vivo X300, Pixel 8, Galaxy A54
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version
      placeholder: e.g. Android 15
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Chroma Flow version
      description: From Settings → Apps → Chroma Flow, or the Play Store page
      placeholder: e.g. 1.3.2
  - type: dropdown
    id: quality
    attributes:
      label: Quality setting
      options: ["Low", "Medium", "High", "Ultra", "Not sure"]
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recording
      description: Drag and drop images or videos here.
